<h3>service-customer-group works!</h3>

@if (errMessage) {
    <div style="color: red; padding: 10px; border: 1px solid red;">
      <strong>Lỗi lấy dữ liệu:</strong> {{ errMessage }}
    </div>
  }

<table border="1" style="width:100%; border-collapse: collapse; text-align:center;" *ngIf="customerGroups">
  <ng-container *ngFor="let group of customerGroups">
    <tr>
      <td colspan="5" style="text-align:left; font-weight:bold;">
        {{ group.CustomerTypeId }} - {{ group.CustomterTypeName }}
      </td>
    </tr>

    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>

    <tr *ngFor="let c of group.Customers">
      <td>{{ c.Id }}</td>
      <td>{{ c.Name }}</td>
      <td>{{ c.Email }}</td>
      <td>{{ c.Age }}</td>
      <td><img [src]="c.Image" alt="{{c.Name}}" width="80" /></td>
    </tr>
  </ng-container>
</table>
